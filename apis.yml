name: El-Dokan
description: El-Dokan (El Dokan Software) is a Cairo, Egypt-based enterprise eCommerce software
  company founded in 2019 that provides an API-first, headless and composable commerce platform for
  the MENA region. Its 300+ REST API endpoints and developer tools let brands and retailers make any
  digital experience shoppable across web, mobile apps, POS, and multi-vendor marketplaces, supporting
  B2C, D2C, B2B, and marketplace models with 100+ payment, shipping, SMS, and ERP integrations and MENA
  localization. Customers include Procter & Gamble, Misr Pharmacies, Mobily, Zahran, Switch Plus, and
  Appetito. El-Dokan raised a $550,000 pre-seed round in 2022 backed by Flat6Labs, EFG EV, 500 Global,
  and Hala Ventures. Public API documentation (data model, getting started, and API reference) is gated
  behind a get-access signup.
